<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arquitecto de Misión</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: tablero de control. Las fases van a la izquierda y los cuatro medidores (presupuesto, masa, energía, datos) quedan fijos a la derecha. */
:root {
  --bg: #E8EDF3; --panel: #F7F9FC; --panel2: #EDF1F7; --ink: #0E1A2D; --ink2: #46566F; --line: #C8D2E0;
  --accent: #1F4FD8; --accent-ink: #FFFFFF; --accent-soft: #DCE5FB;
  --ok: #0B7A5A; --warn: #955C00; --bad: #B3232F;
  --ok-soft: #D5F0E6; --warn-soft: #F8E8C8; --bad-soft: #F8DADD;
  --sun: #D9920B; --earth: #1F6FEB;
  --fd: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --fb: 'IBM Plex Sans', system-ui, sans-serif;
  --fm: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1122; --panel: #111B33; --panel2: #16223F; --ink: #E7EDF9; --ink2: #9AA9C4; --line: #263555;
    --accent: #7C9BFF; --accent-ink: #0A1122; --accent-soft: #1D2D5C;
    --ok: #3DD6A3; --warn: #F2B84B; --bad: #FF7C86;
    --ok-soft: #0F3A31; --warn-soft: #3D3012; --bad-soft: #4A1A21;
    --sun: #F2B84B; --earth: #5E9BFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1122; --panel: #111B33; --panel2: #16223F; --ink: #E7EDF9; --ink2: #9AA9C4; --line: #263555;
  --accent: #7C9BFF; --accent-ink: #0A1122; --accent-soft: #1D2D5C;
  --ok: #3DD6A3; --warn: #F2B84B; --bad: #FF7C86;
  --ok-soft: #0F3A31; --warn-soft: #3D3012; --bad-soft: #4A1A21;
  --sun: #F2B84B; --earth: #5E9BFF; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 15px/1.5 var(--fb); padding-block: 0 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--fd); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; line-height: 1.05; }
h2 { font-size: 30px; } h3 { font-size: 19px; letter-spacing: .06em; color: var(--ink2); margin-top: 28px; }
p { margin: 0; }
.mono { font-family: var(--fm); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 12px/1 var(--fm); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.wrap { max-width: 1180px; margin: 0 auto; }

/* barra superior */
.top { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { font: 700 18px/1 var(--fd); letter-spacing: .12em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.brand i { width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 50%; position: relative; display: inline-block; }
.brand i::after { content: ""; position: absolute; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; right: -4px; top: -4px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 9px 16px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 14px 28px; font-size: 17px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; }

/* portada */
.intro { padding-block: 28px 40px; }
.intro h1 { font-size: clamp(54px, 11vw, 124px); line-height: .92; margin-top: 14px; }
.lede { max-width: 56ch; font-size: 18px; margin-top: 18px; color: var(--ink2); }
.units { list-style: none; padding: 0; margin: 36px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.units li { padding: 18px 18px 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.units b { display: block; font: 500 34px/1 var(--fm); color: var(--accent); }
.units strong { display: block; margin-top: 12px; font: 700 18px/1 var(--fd); letter-spacing: .08em; text-transform: uppercase; }
.units p { margin-top: 6px; font-size: 14px; color: var(--ink2); }
.how { list-style: none; counter-reset: s; padding: 0; margin: 28px 0 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 28px; }
.how li { counter-increment: s; display: flex; gap: 12px; align-items: baseline; }
.how li::before { content: counter(s); font: 600 14px/1 var(--fm); color: var(--accent-ink); background: var(--accent); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; }

/* paso a paso */
.app { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.main { min-width: 0; }
.steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; }
.steps button { flex: 1 0 auto; display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.steps button b { font: 600 11px/1 var(--fm); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line); }
.steps button.cur { border-color: var(--accent); background: var(--accent-soft); }
.steps button.cur b { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps button.done b { background: var(--ok); color: var(--panel); border-color: var(--ok); }
.steps button[disabled] { opacity: .5; cursor: not-allowed; }
.concept { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.concept b { font: 500 11px/1 var(--fm); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 6px; }
.hint { color: var(--ink2); font-size: 14px; margin: 6px 0 12px; max-width: 70ch; }
.advice { border-radius: 8px; padding: 12px 14px; margin-bottom: 18px; border: 1px solid var(--line); display: flex; gap: 10px; font-size: 14px; background: var(--panel2); }
.advice::before { content: "Ingeniero de sistemas"; flex: none; font: 500 11px/1.7 var(--fm); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); width: 84px; }
.advice.bad { background: var(--bad-soft); border-color: var(--bad); }
.advice.warn { background: var(--warn-soft); border-color: var(--warn); }
.advice.ok { background: var(--ok-soft); border-color: var(--ok); }
.advice span { min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.opt { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.opt:hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.bad:not(.sel) { opacity: .6; }
.o-title { font: 700 20px/1.05 var(--fd); letter-spacing: .03em; text-transform: uppercase; }
.o-tag { font: 500 11px/1 var(--fm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.o-desc { font-size: 13px; color: var(--ink2); }
.o-stats { margin: 4px 0 0; display: grid; gap: 2px; }
.o-stats div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; border-top: 1px dashed var(--line); padding-top: 2px; }
.o-stats dt { color: var(--ink2); } .o-stats dd { margin: 0; font-family: var(--fm); font-variant-numeric: tabular-nums; text-align: right; }
.o-stats .bad dd { color: var(--bad); } .o-stats .ok dd { color: var(--ok); } .o-stats .warn dd { color: var(--warn); }
.o-bar { height: 5px; border-radius: 3px; background: var(--panel2); overflow: hidden; margin-top: 2px; }
.o-bar i { display: block; height: 100%; background: var(--accent); }
.mission { padding: 16px; gap: 8px; }
.mission .o-title { font-size: 28px; }
.mission .lvl { font: 500 12px/1 var(--fm); color: var(--accent); letter-spacing: .08em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-family: var(--fm); font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.navrow { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
.navrow .grp { display: flex; gap: 10px; flex-wrap: wrap; }
.link { border-radius: 8px; border: 1px solid var(--line); background: var(--panel); padding: 12px 14px; margin-top: 14px; }
.link .o-bar { height: 8px; margin-top: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-top: 18px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.box h3 { margin-top: 0; font-size: 17px; }
.checks { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 14px; border-top: 1px dashed var(--line); padding-top: 6px; }
.checks li:first-child { border-top: 0; padding-top: 0; }
.checks .ic { font: 600 13px/1 var(--fm); text-align: center; border-radius: 4px; padding: 3px 0; }
.checks .ok .ic { background: var(--ok-soft); color: var(--ok); } .checks .warn .ic { background: var(--warn-soft); color: var(--warn); } .checks .bad .ic { background: var(--bad-soft); color: var(--bad); }
.checks .v { font-family: var(--fm); font-size: 13px; color: var(--ink2); text-align: right; }
.brk { display: grid; gap: 6px; margin-top: 10px; }
.brk div { display: grid; grid-template-columns: 112px minmax(0, 1fr) 64px; gap: 8px; align-items: center; font-size: 13px; }
.brk .o-bar { margin: 0; }
.brk span:last-child { font-family: var(--fm); text-align: right; }
.launch { margin-top: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.warnlist { margin: 12px 0 0; padding-left: 18px; color: var(--warn); font-size: 14px; }

/* panel de control */
.panel { position: sticky; top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 16px; display: grid; gap: 12px; }
.panel h2 { font-size: 16px; letter-spacing: .14em; color: var(--ink2); }
.meter { display: grid; gap: 4px; }
.m-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.m-label { font: 500 11px/1 var(--fm); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.m-val { font: 500 15px/1 var(--fm); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--ok); transition: width .25s; }
.m-warn .bar i { background: var(--warn); } .m-bad .bar i { background: var(--bad); } .m-idle .bar i { background: var(--line); }
.m-warn .m-val { color: var(--warn); } .m-bad .m-val { color: var(--bad); }
.m-sub { font-size: 12px; color: var(--ink2); }
.prob { border-top: 1px solid var(--line); padding-top: 12px; display: flex; justify-content: space-between; align-items: baseline; }
.prob b { font: 500 34px/1 var(--fm); }

/* simulación */
.sim { max-width: 1180px; margin: 0 auto; }
.sim-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.phase { font: 500 13px/1 var(--fm); letter-spacing: .1em; text-transform: uppercase; background: var(--accent-soft); border: 1px solid var(--accent); padding: 8px 12px; border-radius: 6px; }
.sim-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; position: relative; min-width: 0; }
.stage canvas { width: 100%; display: block; }
.stage small { position: absolute; left: 14px; bottom: 10px; font: 400 11px/1 var(--fm); color: var(--ink2); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile span { display: block; font: 500 11px/1 var(--fm); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.tile b { display: block; font: 500 20px/1.3 var(--fm); margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile b.warn { color: var(--warn); } .tile b.bad { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; border-radius: 4px; padding: 3px 8px; border: 1px solid var(--ok); background: var(--ok-soft); color: var(--ok); }
.chip.off { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
.log { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; max-height: 300px; overflow-y: auto; }
.log li { font-size: 13px; padding: 8px 10px; border-radius: 6px; border-left: 4px solid var(--line); background: var(--panel); }
.log li.ok { border-color: var(--ok); } .log li.warn { border-color: var(--warn); } .log li.bad { border-color: var(--bad); background: var(--bad-soft); }
.log li time { font: 500 11px/1 var(--fm); color: var(--ink2); display: block; margin-bottom: 2px; }
.ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }

/* informe */
.report { max-width: 1180px; margin: 0 auto; }
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
.score b { font: 500 clamp(64px, 14vw, 120px)/1 var(--fm); font-variant-numeric: tabular-nums; }
.score span { font: 500 22px/1 var(--fm); color: var(--ink2); }
.grade { font-size: clamp(34px, 7vw, 56px); }
.grade.fail { color: var(--bad); }
.cause { color: var(--bad); margin-top: 8px; font-size: 16px; }
.parts { display: grid; gap: 12px; margin-top: 18px; max-width: 640px; }
.part { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 14px; }
.part .bar i { background: var(--accent); }
.part span:last-child { font-family: var(--fm); text-align: right; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 20px; }
.lessons { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 8px; max-width: 78ch; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .app.has-panel { padding-bottom: 150px; }
  .panel { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; top: auto; border-radius: 12px 12px 0 0; border-width: 1px 0 0; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px;
    padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  .panel h2, .m-sub { display: none; }
  .m-val { font-size: 13px; }
  .prob { border: 0; padding: 0; display: grid; gap: 4px; }
  .prob b { font-size: 20px; }
  .prob .m-sub { display: block; }
  .sim-grid { grid-template-columns: minmax(0, 1fr); }
  .advice { flex-direction: column; gap: 4px; } .advice::before { width: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* modos, banners, nave, decisiones, tablas */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-top: 18px; }
.modes .o-title { font-size: 26px; }
.banner { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
.banner b { font-family: var(--fm); font-weight: 500; }
.diffbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
.tog { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; background: var(--panel); font-size: 14px; }
.tog[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.craft { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 6px; margin-bottom: 14px; }
.craft svg { width: 100%; height: auto; display: block; max-height: 230px; }
.craft p { font-size: 12px; color: var(--ink2); margin-top: 2px; }
.sv-line { stroke: var(--ink2); fill: none; stroke-width: 1.5; }
.sv-body { fill: var(--panel2); stroke: var(--ink2); stroke-width: 1.5; }
.sv-solar { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.sv-metal { fill: var(--line); stroke: var(--ink2); stroke-width: 1.2; }
.sv-inst { fill: var(--accent); }
.sv-txt { fill: var(--ink2); font: 500 10px var(--fm); }
.sv-txt.in { fill: var(--accent-ink); font-size: 7px; }
.sv-shield { fill: none; stroke: var(--warn); stroke-width: 3; stroke-dasharray: 6 4; }
.sv-fuel { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.sv-glow { stroke: var(--sun); stroke-width: 2; }
.sv-empty { fill: none; stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.part { cursor: pointer; }
.part:hover .sv-body, .part:hover .sv-solar, .part:hover .sv-metal, .part:hover .sv-line, .part:focus .sv-body { stroke: var(--accent); }
.part:focus-visible { outline: 2px solid var(--accent); }
.decide { background: var(--panel); border: 2px solid var(--warn); border-radius: 10px; padding: 14px 16px; margin: 12px 0 0; display: grid; gap: 10px; }
.decide h3 { margin: 0; font-size: 26px; color: var(--ink); }
.decide .grid { grid-template-columns: minmax(0, 1fr); }
.decide .opt .o-title { font-size: 18px; }
.opt[disabled] { opacity: .5; cursor: not-allowed; }
.opt .why { font-size: 12px; color: var(--bad); }
.gauges { display: grid; gap: 10px; margin-top: 10px; }
.scroll { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { font: 500 11px/1.2 var(--fm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.tbl td.num { font-family: var(--fm); font-variant-numeric: tabular-nums; }
.tbl td.best { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.tbl td.me { background: var(--accent-soft); }
.field { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; min-width: 0; width: 100%; max-width: 360px; }
.field.code { font-family: var(--fm); font-size: 12px; max-width: 100%; }
.frow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
.names label { display: grid; gap: 4px; font-size: 13px; color: var(--ink2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 60; font-size: 14px; max-width: calc(100vw - 32px); }
.decl { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 8px 10px; border-left: 4px solid var(--line); background: var(--panel); border-radius: 4px; }

/* ============ EVALUACIÓN DEL DISEÑO ============ */

const DIFFS = {
  facil: { id: 'facil', name: 'Fácil', bm: 1.3, hz: 0.6, ev: 0.6, note: 'Más presupuesto y menos fallas' },
  normal: { id: 'normal', name: 'Normal', bm: 1, hz: 1, ev: 1, note: 'Valores de referencia' },

};
const SANDBOX_BUDGET = 5000;

function evaluate(d) {
  const M = byId(MISSIONS, d.mission);
  if (!M) return null;
  const diff = DIFFS[d.diff] || DIFFS.normal;
  const L = byId(LAUNCHERS, d.launcher), B = byId(BUSES, d.bus), P = byId(POWERS, d.power),
    R = byId(PROPS, d.prop), A = byId(ANTS, d.ant), T = byId(TXS, d.tx), N = byId(NETS, d.net);
  const inst = INSTRUMENTS.filter(i => d.inst.includes(i.id));
  const reserve = d.reserve;
  const budget = d.sandbox ? SANDBOX_BUDGET : Math.round(M.budget * diff.bm);

  const mItems = [];
  const addM = (label, v) => { if (v > 0) mItems.push({ label, v }); };
  addM('Bus', B ? B.mass : 0);
  addM('Energía', P ? P.mass : 0);
  addM('Motor y tanques', R ? R.hw : 0);
  addM('Instrumentos', sum(inst, 'mass'));
  addM('Antena y transmisor', (A ? A.mass : 0) + (T ? T.mass : 0));
  addM('Blindaje', d.shield ? EXTRAS.shield.mass : 0);
  addM('Redundancia', d.redund ? EXTRAS.redund.mass : 0);
  const dry = mItems.reduce((s, o) => s + o.v, 0);
  const propFor = pr => {
    const hw = (R ? R.hw : 0);
    const dryAlt = dry - hw + pr.hw;
    return dryAlt * (Math.exp(M.dv / (pr.isp * G0 / 1000)) - 1) * (1 + reserve);
  };
  const prop = R ? propFor(R) : 0;
  const wet = dry + prop;
  const cap = L ? L.cap[M.capKey] : null;
  const mMargin = cap ? (cap - wet) / cap : null;
  const massItems = mItems.slice();
  if (prop > 0) massItems.push({ label: 'Propelente', v: prop });

  const opsDays = M.cruiseDays * (R ? R.time : 1) + M.opsDays;
  const opsCost = opsDays * OPS_PER_DAY;
  const cItems = [];
  const addC = (label, v) => { if (v > 0) cItems.push({ label, v }); };
  addC('Lanzador', L ? L.cost : 0);
  addC('Bus', B ? B.cost : 0);
  addC('Energía', P ? P.cost : 0);
  addC('Propulsión', R ? R.cost : 0);
  addC('Instrumentos', sum(inst, 'cost'));
  addC('Comunicaciones', (A ? A.cost : 0) + (T ? T.cost : 0) + (N ? N.cost : 0));
  addC('Protección', (d.shield ? EXTRAS.shield.cost : 0) + (d.redund ? EXTRAS.redund.cost : 0));
  addC('Operaciones', opsCost);
  const cost = cItems.reduce((s, o) => s + o.v, 0);
  const remain = budget - cost;

  const demandSci = (B ? B.load : 0) + sum(inst, 'power') + (T ? T.draw : 0);
  const demandCruise = (B ? B.load : 0) + (R ? R.power : 0);
  const demand = Math.max(demandSci, demandCruise);
  const gen = P ? (P.solar ? P.w * M.flux * 0.9 : P.w) : 0;
  const pMargin = gen > 0 ? (gen - demand) / gen : null;

  const rate = A && T ? Math.min(300, COMMS_K * A.d * A.d * T.p / (M.dist * M.dist)) : 0;
  const downlink = N ? rate * N.hours * 3.6 : 0;
  const produced = sum(inst, 'data');
  const dataFrac = produced > 0 ? Math.min(1, downlink / produced) : 0;
  const w = inst.reduce((s, i) => s + (M.weights[i.id] || 0), 0);

  const missing = [];
  if (!L) missing.push('lanzador');
  if (!B) missing.push('bus');
  if (!P) missing.push('fuente de energía');
  if (!R) missing.push('propulsión');
  if (!inst.length) missing.push('al menos un instrumento');
  if (!A) missing.push('antena');
  if (!T) missing.push('transmisor');
  if (!N) missing.push('red de estaciones');
  const issues = [];
  if (L && cap === 0) issues.push('El lanzador elegido no puede enviar carga a este destino.');
  else if (L && cap && wet > cap) issues.push('La nave pesa ' + Math.round(wet) + ' kg y el lanzador solo puede llevar ' + Math.round(cap) + ' kg.');
  if (cost > budget) issues.push('El costo ($' + Math.round(cost) + ' M) supera el presupuesto ($' + budget + ' M).');
  if (P && demand > gen) issues.push('La nave necesita ' + Math.round(demand) + ' W y la fuente solo entrega ' + Math.round(gen) + ' W.');
  if (B && sum(inst, 'mass') > B.payloadCap) issues.push('Los instrumentos pesan ' + Math.round(sum(inst, 'mass')) + ' kg y el bus solo admite ' + B.payloadCap + ' kg de carga útil.');
  const warns = [];
  if (mMargin !== null && mMargin >= 0 && mMargin < 0.10) warns.push('Margen de masa bajo (' + Math.round(mMargin * 100) + '%). Lo habitual es dejar 10% a 15%.');
  if (pMargin !== null && pMargin >= 0 && pMargin < 0.10) warns.push('Margen de energía bajo (' + Math.round(pMargin * 100) + '%).');
  if (!d.sandbox && cost <= budget && remain / budget < 0.10) warns.push('Casi sin reserva de presupuesto. Un sobrecosto podría cancelar la misión.');
  if (A && T && N && inst.length && dataFrac < 0.5) warns.push('Solo podrías enviar ' + Math.round(dataFrac * 100) + '% de los datos que producen tus instrumentos.');
  if (inst.length && w < M.target) warns.push('Los instrumentos suman ' + w + ' puntos de ciencia y el objetivo mínimo es ' + M.target + '.');
  if (M.rad >= 3 && !d.shield) warns.push('Júpiter tiene radiación extrema. Sin blindaje el riesgo es muy alto.');
  if (reserve === 0 && R) warns.push('Sin reserva de propelente, una maniobra imperfecta puede fallar y no podrás corregir la trayectoria en vuelo.');

  const ev = {
    M, L, B, P, R, A, T, N, inst, reserve, shield: d.shield, redund: d.redund, diff, sandbox: !!d.sandbox, calm: !!d.calm,
    mass: { items: massItems, dry, prop, wet, cap, margin: mMargin },
    cost: { items: cItems, total: cost, budget, remain, remainFrac: remain / budget, opsCost, opsDays },
    power: { demandSci, demandCruise, demand, gen, margin: pMargin },
    data: { rate, downlink, produced, frac: dataFrac },
    sci: { w, target: M.target, ratio: w / M.target },
    missing, issues, warns, propFor
  };
  ev.complete = missing.length === 0;
  ev.canLaunch = ev.complete && issues.length === 0;
  ev.prob = ev.complete ? probs(ev) : null;
  return ev;
}

function probs(ev, hzOverride) {
  const M = ev.M;
  const hz = hzOverride != null ? hzOverride : ev.diff.hz * (ev.calm ? 0 : 1);
  const mm = ev.mass.margin == null ? 0 : ev.mass.margin;
  const pm = ev.power.margin == null ? 0 : ev.power.margin;
  const mf = 1 + (mm < 0.05 ? 0.5 : mm < 0.10 ? 0.25 : 0) + (pm < 0.10 ? 0.3 : 0);
  const rs = ev.shield ? 0.15 : 1, rd = ev.redund ? 0.6 : 1;
  const rf = ev.reserve >= 0.25 ? 0.6 : ev.reserve >= 0.10 ? 1 : 2.2;
  const launch = 1 - (1 - ev.L.rel * (mm < 0.05 ? 0.97 : 1)) * hz;
  const hCruise = Math.min(0.9, M.base.cruise * (1 + M.rad * rs * 0.5) * rd * mf * hz);
  const hIns = Math.min(0.9, M.base.ins * rf * mf * hz);
  const hOps = Math.min(0.9, M.base.ops * (1 + M.rad * rs) * rd * mf * hz);
  const hBudget = 0.4 * clamp((0.12 - ev.cost.remainFrac) / 0.07, 0, 1);
  const total = launch * (1 - hCruise) * (1 - hIns) * (1 - hOps) * (1 - hBudget);
  return { launch, hCruise, hIns, hOps, hBudget, total, mf, rs, rd };
}

function scoreParts(o) {
  const sc = Math.min(1.25, o.ratio) * o.dataFrac;
  return {
    sci: Math.round(60 * sc / 1.25),
    bud: Math.round(20 * clamp(o.remainFrac / 0.15, 0, 1)),
    mar: Math.round(20 * (clamp(o.mm / 0.15, 0, 1) + clamp(o.pm / 0.15, 0, 1)) / 2)
  };
}
function plannedScore(ev) {
  const p = scoreParts({ ratio: ev.sci.ratio, dataFrac: ev.data.frac, remainFrac: ev.cost.remainFrac, mm: ev.mass.margin || 0, pm: ev.power.margin || 0 });
  return p.sci + p.bud + p.mar;
}

      inst: o.i.filter((x, k, a) => a.indexOf(x) === k), ant: o.a || null, tx: o.t || null, net: o.n || null, diff: DIFFS[o.f] ? o.f : 'normal', sandbox: !!o.x, calm: !!o.c };
  } catch (e) { return null; }
}

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

    { k: 4, t: 0.53, pool: ['insertion'], p: 0.85 },
    { k: 5, t: 0.68, pool: ['power', 'instrument', 'comms'], p: 0.7 },
    { k: 6, t: 0.80, pool: ['budget', 'instrument', 'discovery'], p: 0.7 },
    { k: 7, t: 0.90, pool: ['discovery', 'power', 'comms'], p: 0.55 }
  ];
  const used = {}, out = [];
  slots.forEach(s => {
    const r = rng(seed * 7919 + s.k * 104729 + 13);
    const roll = r(), pickR = r(), x = r(), xi = r();
    if (ev.calm || roll >= Math.min(0.95, s.p * ev.diff.ev)) return;
    let idx = Math.floor(pickR * s.pool.length), type = null;
    for (let j = 0; j < s.pool.length; j++) { const tp = s.pool[(idx + j) % s.pool.length]; if (!used[tp]) { type = tp; break; } }
    if (!type) return;
    used[type] = true;
    out.push({ k: s.k, t: s.t, type, x, xi, r });
  });
  return out;
}

function simulate(ev, d, seed, choices, auto) {
  choices = choices || {};
  const M = ev.M, praw = probs(ev, 1), hz = ev.diff.hz * (ev.calm ? 0 : 1);
  const R = k => rng(seed * 7919 + k * 104729 + 13);
  const S = { days: 0, extDays: 0, extra: 0, lost: {}, resUsed: 0, sciBonus: 0, sciMult: 1, dataMult: 1, rfIns: 1, mod: { launch: 1, cruise: 1, ins: 1, ops: 1 }, add: { launch: 0, cruise: 0, ins: 0 } };
  const beats = [], decisions = [];
  let fatal = null, tEnd = 1, pending = null;
  const add = (t, kind, text, x) => beats.push(Object.assign({ t, kind, text, res: S.resUsed }, x || {}));
  const end = (t, cause, text) => { add(t, 'bad', text, { fatal: cause }); fatal = { t, cause }; tEnd = t; };
  const reserveKg = ev.mass.prop * ev.reserve / (1 + ev.reserve);
  const rfNow = () => { const e = ev.reserve * (1 - S.resUsed); return e >= 0.25 ? 0.6 : e >= 0.10 ? 1 : 2.2; };

  const items = [];
  const it = (t, f) => items.push({ t, f });
  it(0, () => add(0, 'info', 'Cuenta regresiva completada. Los motores se encienden.'));
  planEvents(ev, d, seed).forEach(e => items.push({ t: e.t, e }));
  it(0.04, () => {
    const failP = clamp((1 - praw.launch) * hz * S.mod.launch + S.add.launch * ev.diff.ev * (ev.calm ? 0 : 1), 0, 0.95);
    if (R(20)() < failP) end(0.04, 'launch', 'El ' + ev.L.name.toLowerCase() + ' falla durante el ascenso. Se pierde la nave.');
    else add(0.04, 'ok', 'Separación exitosa. La nave viaja hacia ' + M.body + '.');
  });
  it(0.10, () => add(0.10, 'info', 'Corrección de trayectoria completada. Desviación mínima.'));
  it(0.46, () => {
    const h = clamp(praw.hCruise * hz * S.mod.cruise + S.add.cruise * ev.diff.ev * (ev.calm ? 0 : 1), 0, 0.9);
    if (R(21)() < h) end(0.46, 'cruise', 'Falla del computador de vuelo durante el crucero. Se pierde el contacto.');
    else add(0.46, 'info', 'La nave llega a ' + M.body + ' sin novedades graves.');
  });
  it(0.50, () => { S.rfIns = rfNow(); });
  it(0.57, () => {
    const h = clamp(M.base.ins * S.rfIns * praw.mf * hz * S.mod.ins + S.add.ins * ev.diff.ev * (ev.calm ? 0 : 1), 0, 0.9);
    if (R(22)() < h) end(0.57, 'insertion', 'El frenado falla. La nave pasa de largo y no entra en órbita.');
    else add(0.57, 'ok', 'Inserción orbital exitosa. Reserva de propelente restante: ' + Math.round(reserveKg * (1 - S.resUsed)) + ' kg.');
  });
  it(0.64, () => add(0.64, 'ok', M.firstLight));
  it(0.70, () => {
    const r = R(23), roll = r(), pk = r(), al = aliveOf(S, d);
    if (al.length && roll < clamp(0.2 * hz * (ev.redund ? 0.4 : 1), 0, 0.9)) {
      const id = al[Math.floor(pk * al.length)]; S.lost[id] = lostFrac(0.70);
      add(0.70, 'bad', 'Falla en el instrumento ' + nmI(id) + '. Deja de enviar datos.', { lose: id });
    }
  });
  it(0.76, () => add(0.76, 'info', M.milestone));
  const tOps = [0.72, 0.86, 0.95][Math.floor(R(24)() * 3)];
  it(tOps, () => {
    const h = clamp(praw.hOps * hz * S.mod.ops, 0, 0.9);
    if (R(25)() < h) end(tOps, 'ops', M.opsFatal);
  });
  it(0.98, () => add(0.98, 'info', 'Termina la campaña principal. Los datos se archivan.'));
  items.sort((a, b) => a.t - b.t);

  for (let n = 0; n < items.length && !fatal && !pending; n++) {
    const item = items[n];
    if (!item.e) { item.f(); continue; }
    const e = item.e, def = EVENTS[e.type];
    const c = { ev, d, t: e.t, r: e.r, x: e.x, amt: Math.round(M.budget * (0.05 + 0.07 * e.x)) };
    if (e.type === 'instrument') { const al = aliveOf(S, d); if (!al.length) continue; c.X = al[Math.floor(e.xi * al.length)]; }
    const opts = def.options.map(o => { const why = o.need ? o.need(ev, S, d) : null; return { id: o.id, label: o.label, desc: o.desc, disabled: !!why, reason: why, q: qOf(o, ev, S, d, c) }; });
    add(e.t, 'ask', def.title, { slot: e.k });
    let chosen = choices[e.k];
    const enabled = opts.filter(o => !o.disabled);
    if (chosen && !enabled.some(o => o.id === chosen)) chosen = null;
    if (!chosen && auto) {
      if (auto === 'random') chosen = enabled[Math.floor(Math.random() * enabled.length)].id;
      else if (auto === 'best') chosen = enabled.slice().sort((a, b) => b.q - a.q)[0].id;
      else chosen = enabled[0].id;
    }
    if (!chosen) { pending = { slot: e.k, t: e.t, type: e.type, title: def.title, phase: def.phase, role: def.role, text: def.text(ev, S, c), options: opts }; break; }
    const o = def.options.find(x => x.id === chosen);
    const out = o.apply(S, c);
    const best = enabled.filter(x => x.q === Math.max.apply(null, enabled.map(y => y.q)));
    decisions.push({ slot: e.k, type: e.type, title: def.title, phase: def.phase, role: def.role, chosen: o.label, optId: o.id, q: qOf(o, ev, S, d, c), result: out.text,
      best: best.map(x => x.label), bestWhy: def.options.find(x => x.id === best[0].id).why, why: o.why, t: e.t });
    if (out.fatal) { end(e.t + 0.004, out.fatal, out.text); break; }
    add(e.t + 0.004, out.kind, out.text, { cost: out.cost, lose: out.lose });
    if (ev.cost.remain - S.extra < 0) { end(e.t + 0.006, 'budget', 'El sobrecosto supera la reserva. El programa se cancela.'); break; }
  }

  if (pending) return { final: false, pending, beats, tEnd: pending.t, seed, decisions, fatal: null };
  if (!fatal) add(1, 'ok', 'Fin de la misión nominal.');

  const opsDone = !fatal ? 1 : (fatal.cause === 'ops' || fatal.cause === 'budget') ? clamp((fatal.t - 0.6) / 0.4, 0, 1) : 0;
  let wEff = 0, pEff = 0;
  d.inst.forEach(id => {
    const f = Math.min(id in S.lost ? S.lost[id] : 1, opsDone);
    wEff += f * (M.weights[id] || 0);
    pEff += f * byId(INSTRUMENTS, id).data;
  });
  wEff *= S.sciMult * (1 + (fatal ? 0 : S.sciBonus));
  const prodAvg = opsDone > 0 ? pEff / opsDone : 0;
  const dataFrac = prodAvg > 0 ? Math.min(1, ev.data.downlink * S.dataMult / prodAvg) : 0;
  const dataGb = (M.opsDays + (fatal ? 0 : S.extDays)) * pEff * dataFrac;
  const spentOps = ev.cost.opsCost * clamp((tEnd - 0.05) / 0.95, 0, 1);
  const finalCost = ev.cost.total - ev.cost.opsCost + spentOps + S.extra;
  const remainFrac = (ev.cost.budget - finalCost) / ev.cost.budget;
  const parts = scoreParts({ ratio: wEff / M.target, dataFrac, remainFrac, mm: ev.mass.margin || 0, pm: ev.power.margin || 0 });
  let total, grade;
  if (fatal && opsDone === 0) { total = Math.round((parts.bud + parts.mar) / 2); parts.sci = 0; grade = 'Misión perdida'; }
  else {
    total = parts.sci + parts.bud + parts.mar;
    if (fatal) grade = 'Misión interrumpida';
    else grade = total >= 85 ? 'Misión ejemplar' : total >= 70 ? 'Misión exitosa' : total >= 50 ? 'Éxito parcial' : 'Resultados modestos';
  }
  const res = {
    final: true, pending: null, seed, beats, tEnd, fatal, parts, total, grade, decisions,
    metrics: { dataGb, opsDone, lost: Object.keys(S.lost), lostAt: S.lost, extra: S.extra, finalCost, remainFrac, delayDays: S.days, propLeft: reserveKg * (1 - S.resUsed), dataFrac, wEff, spentOps, sciMult: S.sciMult, sciBonus: S.sciBonus, dataMult: S.dataMult, extDays: S.extDays }
  };
  res.lessons = lessons(ev, d, res);
  res.analysis = analyze(ev, d, res);
  return res;
}

/* ============ ANÁLISIS POSTERIOR ============ */
const FATAL_TEXT = {
  launch: 'La nave se perdió en el lanzamiento.',
  cruise: 'La nave falló durante el viaje.',
  insertion: 'La nave no logró entrar en órbita.',
  ops: 'La nave falló durante las operaciones científicas.',
  budget: 'El programa se canceló por falta de presupuesto.'
};
function lessons(ev, d, res) {
  const M = ev.M, m = res.metrics, out = [];
  const f = res.fatal;
  if (f) {
    const why = {
      launch: 'El lanzador tiene una confiabilidad de ' + Math.round(ev.L.rel * 100) + '%. Ninguna misión elimina ese riesgo, por eso importan las pruebas y los respaldos.',
      cruise: 'Los viajes largos exponen la nave a más fallas. La redundancia y el blindaje reducen ese riesgo.',
      insertion: 'La inserción orbital es una maniobra de un solo intento. Más reserva de propelente baja el riesgo de fallar.',
      ops: M.rad >= 3 ? 'La radiación de Júpiter destruye electrónica sin protección. El blindaje y la redundancia cambian mucho las probabilidades.' : 'Las fallas en operaciones se reducen con redundancia y con buenos márgenes de diseño.',
      budget: 'Los sobrecostos son normales en misiones reales. Por eso se guarda una reserva de 15% a 25% del presupuesto.'
    };
    out.push(why[f.cause]);
  }
  if (ev.data.frac < 0.7) out.push('Tu enlace solo permitió enviar ' + Math.round(ev.data.frac * 100) + '% de los datos. La señal cae con el cuadrado de la distancia: antena más grande, más potencia o más horas de contacto ayudan.');
  if (ev.mass.margin < 0.10) out.push('Tu margen de masa fue ' + Math.round(ev.mass.margin * 100) + '%. En proyectos reales la masa casi siempre crece durante el desarrollo, y se exige 10% o más de margen.');
  if (ev.power.margin < 0.10) out.push('Tu margen de energía fue ' + Math.round(ev.power.margin * 100) + '%. Con poco margen cualquier falla o degradación deja instrumentos apagados.');
  if (!ev.sandbox && ev.cost.remainFrac < 0.10) out.push('Dejaste menos de 10% del presupuesto como reserva. Eso te expone a cancelaciones por sobrecosto.');
  if (ev.R && ['ion', 'hall', 'vx'].includes(ev.R.id)) {
    const chem = ev.propFor(PROPS[0]);
    out.push('La propulsión iónica usó ' + Math.round(ev.mass.prop) + ' kg de propelente. La química habría necesitado cerca de ' + Math.round(chem) + ' kg. Ahorraste masa a cambio de energía y tiempo de viaje.');
  }
  if (ev.P && ev.P.solar && M.flux < 0.5) out.push('A esa distancia el Sol da solo ' + Math.round(M.flux * 100) + '% de su luz. Por eso necesitaste paneles grandes.');
  if (ev.P && !ev.P.solar) out.push('Los RTG entregan energía constante sin depender del Sol, pero cuestan mucho más por vatio.');
  if (m.lost.length && !d.redund) out.push('Perdiste instrumentos por fallas. Los sistemas redundantes habrían reducido ese riesgo en 40%.');
  if (!f && res.total >= 85) out.push('Lograste un buen equilibrio entre ciencia, presupuesto y márgenes. Prueba una misión más difícil.');
  return out.slice(0, 4);
}

function analyze(ev, d, res) {
  const M = ev.M, m = res.metrics, f = res.fatal, p = ev.prob, pc = x => Math.round(x * 100) + '%';
  const verdict = [], improve = [];
  const dec = res.decisions || [];
  if (f) {
    const risk = { launch: 1 - p.launch, cruise: p.hCruise, insertion: p.hIns, ops: p.hOps, budget: p.hBudget }[f.cause];
    verdict.push(FATAL_TEXT[f.cause] + ' En tu diseño esa fase tenía ' + pc(risk) + ' de riesgo de falla' + (ev.calm ? ' (modo sin eventos aleatorios).' : '.'));
    const bad = dec.filter(x => x.q === 0 && x.t <= f.t);
    if (bad.length) verdict.push('Tomaste decisiones de alto riesgo: ' + bad.map(x => '«' + x.chosen + '» (' + x.title.toLowerCase() + ')').join(', ') + '. Esas decisiones aumentaron la probabilidad de falla.');
    else if (risk < 0.12) verdict.push('Fue mala suerte: el riesgo era bajo. En misiones reales también pasa, y por eso se diseñan márgenes y respaldos.');
    if (f.cause === 'ops' && M.rad >= 3 && !d.shield) verdict.push('Júpiter emite radiación extrema y tu nave no llevaba blindaje.');
    if (f.cause === 'budget') verdict.push('Dejaste ' + pc(Math.max(0, ev.cost.remainFrac)) + ' del presupuesto como reserva y los sobrecostos la superaron.');
  } else {
    verdict.push('La nave completó todas las fases. La probabilidad de éxito de tu diseño era ' + pc(p.total) + '.');
    const good = [];
    if ((ev.mass.margin || 0) >= 0.15 && (ev.power.margin || 0) >= 0.15) good.push('buenos márgenes de masa y energía');
    if (d.redund) good.push('sistemas redundantes');
    if (d.shield) good.push('blindaje de radiación');
    if (ev.reserve >= 0.25) good.push('reserva de propelente alta');
    const goodDec = dec.filter(x => x.q === 2).length;
    if (goodDec) good.push(goodDec + (goodDec === 1 ? ' buena decisión' : ' buenas decisiones') + ' en vuelo');
    if (good.length) verdict.push('Lo que más ayudó: ' + good.join(', ') + '.');
    if (res.parts.sci < 45) verdict.push('La ciencia obtenida fue ' + res.parts.sci + ' de 60 puntos. ' + (m.dataFrac < 0.8 ? 'Parte de los datos no llegó a la Tierra.' : m.lost.length ? 'Perdiste ' + m.lost.length + ' instrumento(s).' : 'Los instrumentos no alcanzaron el objetivo científico.'));
  }
  dec.forEach(x => {
    if (x.q < 2 && x.best.indexOf(x.chosen) < 0) improve.push('En «' + x.title + '» elegiste «' + x.chosen + '». Mejor opción: «' + x.best[0] + '». ' + x.bestWhy);
  });
  res.lessons.forEach(l => improve.push(l));
  const decisions = dec.map(x => ({ title: x.title, phase: x.phase, chosen: x.chosen, result: x.result, q: x.q, why: x.why, best: x.best, role: x.role }));
  return { verdict, decisions, improve: improve.slice(0, 6) };
}

function meter(label, val, sub, ratio, st) {

const lim = (r, w) => r > 1 ? 'bad' : r > (w || 0.9) ? 'warn' : 'ok';

function panelHTML(ev) {
  if (!ev) {

function advice(ev) {
  if (!ev) return null;
  const M = ev.M, ms = ev.mass, pw = ev.power, c = ev.cost;
  if (ev.L && ms.cap === 0) return ['bad', 'Este cohete no llega a ' + M.body + '. Elige uno de mayor capacidad.'];
  if (ms.cap && ms.wet > ms.cap) return ['bad', 'Tu nave pesa ' + fmt(ms.wet) + ' kg y el cohete lleva ' + fmt(ms.cap) + ' kg. Prueba con menos instrumentos, propulsión iónica (usa menos propelente) o un lanzador mayor.'];
  if (c.total > c.budget) return ['bad', 'Te pasaste del presupuesto por $' + fmt(c.total - c.budget) + ' M. Revisa los componentes más caros en el último paso.'];
  if (ev.P && pw.demand > pw.gen) return ['bad', 'Necesitas ' + fmt(pw.demand) + ' W y la fuente da ' + fmt(pw.gen) + ' W.' + (ev.P.solar && M.flux < 0.8 ? ' Recuerda que en ' + M.body + ' los paneles reciben solo ' + M.facts.sun + ' de la luz.' : ' Elige una fuente mayor o quita consumos.')];
  if (ev.B && sum(ev.inst, 'mass') > ev.B.payloadCap) return ['bad', 'Tus instrumentos pesan ' + fmt(sum(ev.inst, 'mass')) + ' kg y el bus admite ' + ev.B.payloadCap + ' kg. Elige un bus mayor o quita un instrumento.'];
  const here = [[], ['lanzador'], ['bus', 'fuente de energía', 'propulsión'], ['al menos un instrumento'], ['antena', 'transmisor', 'red de estaciones']][state.step] || [];
  const miss = ev.missing.filter(m => here.includes(m));
  if (miss.length) return ['', 'En esta fase falta elegir: ' + miss.join(', ') + '.'];
  if (!ev.complete) return ['ok', 'Esta fase está lista. Continúa con la siguiente y observa cómo cambian los medidores.'];
  if (ev.warns.length) return ['warn', ev.warns[0]];
  return ['ok', 'Diseño válido y con buenos márgenes. Revisa el último paso y lanza.'];
}

  if (state.mode === 'compete') {
    const t = state.teams[state.cur];
    return '<div class="banner"><b>COMPETENCIA</b> · Diseña el equipo <b>' + esc(t.name) + '</b> (' + (state.cur + 1) + ' de ' + state.teams.length + '). Misma misión, misma dificultad y mismos eventos para todos.</div>';
  }
  if (state.mode === 'coop') {
    const r = STEP_ROLE[state.step], who = memberOf(r);
    return '<div class="banner"><b>EQUIPO</b> · Turno de <b>' + esc(who) + '</b> · ' + ROLE_NAMES[r] + '. Los demás pueden aconsejar, pero decide ' + esc(who) + '.</div>';
  }
  return '';
}

function step0(ev) {
  const d = state.d, best = store.get(RANK_KEY, []);
  const topOf = id => { const v = best.filter(e => e.m === id && !e.t).map(e => e.s); return v.length ? Math.max.apply(null, v) : null; };
  const cards = MISSIONS.map(M => pick('mission', M.id, d.mission === M.id, {
    cls: 'mission', tag: '<span class="lvl">' + '●'.repeat(M.level) + '○'.repeat(4 - M.level) + ' ' + M.levelName + '</span>', title: M.name,
    desc: M.dest + '. ' + M.brief,
    stats: [['Presupuesto', d.sandbox ? 'Sin límite' : '$' + Math.round(M.budget * (DIFFS[d.diff] || DIFFS.normal).bm) + ' M'], ['Distancia', M.facts.dist], ['Viaje', M.facts.trip], ['Luz solar', M.facts.sun], ['Radiación', M.facts.rad], ['Mejor puntaje', topOf(M.id) != null ? topOf(M.id) + ' / 100' : '—']]
  })).join('');
  let ctl;
  if (state.mode === 'sandbox') ctl = '<div class="diffbar"><button type="button" class="tog" data-act="calm" data-key="calm" aria-pressed="' + d.calm + '">' + (d.calm ? '✓' : '○') + ' Sin fallas ni eventos aleatorios</button><span class="hint" style="margin:0">Útil para ver cómo se comporta tu diseño sin sorpresas.</span></div>';
  else ctl = '<div class="diffbar"><span class="m-label">Dificultad</span><div class="seg" role="group" aria-label="Dificultad">' + Object.keys(DIFFS).map(k => '<button type="button" data-act="diff" data-v="' + k + '" data-key="df-' + k + '" aria-pressed="' + (d.diff === k) + '">' + DIFFS[k].name + '</button>').join('') +
    '</div><span class="hint" style="margin:0">' + DIFFS[d.diff].note + ': presupuesto ×' + fmt(DIFFS[d.diff].bm, 2) + ' y fallas ×' + fmt(DIFFS[d.diff].hz, 1) + '.</span></div>';
  const sel = ev ? '<p class="hint" style="margin-top:14px"><b>' + ev.M.name + ':</b> ' + ev.M.focus + '</p>' : '';
  return concept('Cada misión parte de una pregunta científica. El destino fija cuánta energía, combustible y comunicación necesitarás. Empieza por la primera si es tu primera vez.') + ctl +
    '<div class="grid wide">' + cards + '</div>' + sel;
}

function step1(ev) {
  const M = ev.M, maxCap = Math.max.apply(null, LAUNCHERS.map(l => l.cap[M.capKey]));
  return concept('El lanzador decide cuánta masa llega a ' + M.body + '. Uno más grande cuesta más y no siempre es más confiable: los modelos nuevos tienen menos vuelos de prueba.') +
    '<div class="grid">' + LAUNCHERS.map(l => {
      const c = l.cap[M.capKey];
      return pick('launcher', l.id, state.d.launcher === l.id, { title: l.name, desc: l.note, bar: maxCap ? c / maxCap : 0,
        stats: [['Capacidad a destino', c ? fmt(c) + ' kg' : 'No llega', c ? '' : 'bad'], ['Costo', '$' + l.cost + ' M'], ['Confiabilidad', pc(l.rel)]] });
    }).join('') + '</div>';
}

function step2(ev) {
  const M = ev.M, d = state.d;
  const bus = BUSES.map(b => pick('bus', b.id, d.bus === b.id, { title: b.name, desc: b.note, stats: [['Masa', b.mass + ' kg'], ['Consumo base', b.load + ' W'], ['Carga útil máx.', b.payloadCap + ' kg'], ['Costo', '$' + b.cost + ' M']] })).join('');
  const pow = POWERS.map(p => {
    const g = p.solar ? p.w * M.flux * 0.9 : p.w;
    return pick('power', p.id, d.power === p.id, { title: p.name, tag: p.solar ? 'Solar' : 'Nuclear', stats: [['Genera en ' + M.body, fmt(g) + ' W', g < 150 ? 'bad' : ''], ['Masa', p.mass + ' kg'], ['Costo', '$' + p.cost + ' M']] });
  }).join('');
  const props = PROPS.map(p => pick('prop', p.id, d.prop === p.id, { title: p.name, desc: p.note,
    stats: [['Eficiencia (Isp)', p.isp + ' s'], ['Propelente necesario', fmt(ev.propFor(p)) + ' kg'], ['Consumo eléctrico', p.power ? p.power + ' W' : '0 W'], ['Masa del motor', p.hw + ' kg'], ['Costo', '$' + p.cost + ' M']] })).join('');
  const res = [0, 0.10, 0.25].map(v => '<button type="button" data-act="reserve" data-v="' + v + '" data-key="res-' + v + '" aria-pressed="' + (d.reserve === v) + '">' + pc(v) + '</button>').join('');
  const ex = ['shield', 'redund'].map(k => opt({ act: 'toggle', attrs: 'data-k="' + k + '"', key: 'tg-' + k, sel: d[k], title: EXTRAS[k].name, desc: EXTRAS[k].note, stats: [['Masa', EXTRAS[k].mass + ' kg'], ['Costo', '$' + EXTRAS[k].cost + ' M']] })).join('');
  return concept('La nave es un sistema: el bus la sostiene, la fuente de energía la alimenta y el motor la frena al llegar. Cada pieza suma masa y costo, y la masa extra obliga a llevar más propelente.') +
    '<h3 style="margin-top:6px">Bus</h3><p class="hint">Estructura, computador y radio base. Un bus mayor admite más instrumentos, pero consume más energía.</p><div class="grid">' + bus + '</div>' +
    '<h3>Fuente de energía</h3><p class="hint">' + cap1(M.body) + ' recibe ' + M.facts.sun + ' de la luz solar que llega a la Tierra. Los paneles pierden fuerza al alejarse del Sol. Los RTG dan energía constante, pero cuestan mucho.</p><div class="grid">' + pow + '</div>' +
    '<h3>Propulsión</h3><p class="hint">Para frenar y entrar en órbita esta misión necesita cambiar su velocidad en ' + fmt(M.dv, 1) + ' km/s. Mayor eficiencia significa menos propelente, que es masa que no tienes que lanzar.</p><div class="grid wide">' + props + '</div>' +
    '<p class="hint" style="margin-top:14px"><b>Reserva de propelente.</b> Cubre errores de la maniobra y sirve para corregir la trayectoria durante el vuelo. Pesa más, pero te da opciones cuando ocurra un problema.</p><div class="seg" role="group" aria-label="Reserva de propelente">' + res + '</div>' +
    '<h3>Protección</h3><p class="hint">Extras opcionales. Cuestan masa y dinero, pero reducen el riesgo de falla y desbloquean opciones durante el vuelo.</p><div class="grid wide">' + ex + '</div>';
}

function step3(ev) {
  const M = ev.M, d = state.d, B = ev.B, used = sum(ev.inst, 'mass');
  const cards = INSTRUMENTS.map(i => {
    const w = M.weights[i.id] || 0, on = d.inst.includes(i.id);
    return opt({ act: 'inst', attrs: 'data-id="' + i.id + '"', key: 'inst-' + i.id, sel: on, title: i.name, desc: i.desc,
      tag: w ? 'Aporte científico ' + '●'.repeat(w) + '○'.repeat(3 - w) : 'Poco útil en esta misión',
      stats: [['Masa', i.mass + ' kg'], ['Energía', i.power + ' W'], ['Datos', fmt(i.data, 1) + ' Gb/día'], ['Costo', '$' + i.cost + ' M']] });
  }).join('');
  const lineMass = B ? '<div class="link"><div class="m-top"><span class="m-label">Carga útil del bus</span><span class="m-val">' + fmt(used) + ' / ' + B.payloadCap + ' kg</span></div><div class="o-bar"><i style="width:' + clamp(used / B.payloadCap, 0, 1) * 100 + '%;background:var(--' + (used > B.payloadCap ? 'bad' : 'accent') + ')"></i></div></div>' : '<p class="hint">Elige un bus en la fase Nave para ver cuánta carga útil admite.</p>';
  return concept('Cada instrumento aporta ciencia, pero pesa, consume energía y produce datos. Necesitas sumar ' + M.target + ' puntos de ciencia para cumplir el objetivo mínimo de ' + M.name + '. No todo cabe.') +
    '<div class="grid wide">' + cards + '</div>' + lineMass;
}

function step4(ev) {
  const M = ev.M, d = state.d, dt = ev.data;
  const ant = ANTS.map(a => pick('ant', a.id, d.ant === a.id, { title: a.name, stats: [['Masa', a.mass + ' kg'], ['Costo', '$' + a.cost + ' M']] })).join('');
  const tx = TXS.map(t => pick('tx', t.id, d.tx === t.id, { title: t.name, stats: [['Consumo eléctrico', t.draw + ' W'], ['Masa', t.mass + ' kg'], ['Costo', '$' + t.cost + ' M']] })).join('');
  const net = NETS.map(n => pick('net', n.id, d.net === n.id, { title: n.name, stats: [['Contacto diario', n.hours + ' h'], ['Costo', '$' + n.cost + ' M']] })).join('');
  const link = (d.ant && d.tx && d.net) ? '<div class="link"><div class="m-top"><span class="m-label">Tu enlace con la Tierra</span><span class="m-val">' + fmt(dt.rate, 2) + ' Mbps</span></div>' +
    '<p class="hint" style="margin:6px 0 0">Puedes enviar <b>' + fmt(dt.downlink, 1) + ' Gb por día</b>. Tus instrumentos producen <b>' + fmt(dt.produced, 1) + ' Gb por día</b>. ' +
    (dt.produced > 0 ? (dt.frac >= 1 ? 'Alcanza para todo.' : 'Solo llegaría ' + pc(dt.frac) + ' de la ciencia.') : 'Elige instrumentos para comparar.') + '</p>' +
    '<div class="o-bar"><i style="width:' + dt.frac * 100 + '%;background:var(--' + (dt.frac >= 1 ? 'ok' : dt.frac >= 0.5 ? 'warn' : 'bad') + ')"></i></div></div>' : '<p class="hint" style="margin-top:14px">Elige antena, transmisor y red para ver cuántos datos puedes enviar.</p>';
  return concept('Lo que no baja a la Tierra no cuenta como ciencia. La velocidad de envío crece con el diámetro de la antena al cuadrado y con la potencia, y cae con el cuadrado de la distancia. ' + cap1(M.body) + ' está a ' + M.facts.dist + '.') +
    '<h3 style="margin-top:6px">Antena de la nave</h3><div class="grid">' + ant + '</div><h3>Transmisor</h3><div class="grid">' + tx + '</div><h3>Estaciones en Tierra</h3><div class="grid">' + net + '</div>' + link;
}

function checkRow(st, text, v) { return '<li class="' + st + '"><span class="ic">' + (st === 'ok' ? 'OK' : st === 'warn' ? '!' : '✕') + '</span><span>' + text + '</span><span class="v">' + v + '</span></li>'; }
function brk(items, unit) {
  const mx = Math.max.apply(null, items.map(i => i.v));
  return '<div class="brk">' + items.slice().sort((a, b) => b.v - a.v).map(i => '<div><span>' + i.label + '</span><span class="o-bar"><i style="width:' + i.v / mx * 100 + '%"></i></span><span>' + fmt(i.v) + unit + '</span></div>').join('') + '</div>';
}
function shareBox(d, defName) {
  const code = designToCode(d), draft = state.saveDraft || defName;
  return '<div class="box" style="margin-top:18px"><h3>Guardar y compartir este diseño</h3><p class="hint">Guárdalo en «Mis diseños» para compararlo después, o copia el código y envíaselo a otra persona. Quien lo reciba puede importarlo.</p>' +
    '<div class="frow"><input class="field" id="save-name" type="text" maxlength="40" value="' + esc(draft) + '" aria-label="Nombre del diseño"><button type="button" class="btn" data-act="savedesign" data-key="savedesign">Guardar en Mis diseños</button></div>' +
    '<div class="frow"><input class="field code" id="code-out" type="text" readonly value="' + esc(code) + '" aria-label="Código del diseño"><button type="button" class="btn" data-act="copycode" data-key="copycode">Copiar código</button></div></div>';
}
function step5(ev) {
  const M = ev.M, ms = ev.mass, pw = ev.power, c = ev.cost, p = ev.prob;
  const rows = [];
  rows.push(ev.complete ? checkRow('ok', 'Todas las partes elegidas', '') : checkRow('bad', 'Falta elegir: ' + ev.missing.join(', '), ''));
  rows.push(ms.cap == null ? checkRow('bad', 'Masa total', 'sin lanzador') : ms.cap === 0 || ms.wet > ms.cap ? checkRow('bad', 'Masa total', fmt(ms.wet) + ' / ' + fmt(ms.cap || 0) + ' kg') : checkRow(ms.margin < 0.1 ? 'warn' : 'ok', 'Masa total (margen ' + pc(ms.margin) + ')', fmt(ms.wet) + ' / ' + fmt(ms.cap) + ' kg'));
  rows.push(c.total > c.budget ? checkRow('bad', 'Presupuesto', '$' + fmt(c.total) + ' / ' + c.budget + ' M') : checkRow(!ev.sandbox && c.remainFrac < 0.1 ? 'warn' : 'ok', ev.sandbox ? 'Presupuesto (modo libre)' : 'Presupuesto (reserva ' + pc(c.remainFrac) + ')', '$' + fmt(c.total) + (ev.sandbox ? ' M' : ' / ' + c.budget + ' M')));
  rows.push(!ev.P ? checkRow('bad', 'Energía', 'sin fuente') : pw.demand > pw.gen ? checkRow('bad', 'Energía', fmt(pw.demand) + ' / ' + fmt(pw.gen) + ' W') : checkRow(pw.margin < 0.1 ? 'warn' : 'ok', 'Energía (margen ' + pc(pw.margin) + ')', fmt(pw.demand) + ' / ' + fmt(pw.gen) + ' W'));
  rows.push(!ev.B ? checkRow('bad', 'Carga útil del bus', 'sin bus') : sum(ev.inst, 'mass') > ev.B.payloadCap ? checkRow('bad', 'Carga útil del bus', fmt(sum(ev.inst, 'mass')) + ' / ' + ev.B.payloadCap + ' kg') : checkRow('ok', 'Carga útil del bus', fmt(sum(ev.inst, 'mass')) + ' / ' + ev.B.payloadCap + ' kg'));
  rows.push(!ev.inst.length ? checkRow('bad', 'Ciencia', 'sin instrumentos') : checkRow(ev.sci.ratio >= 1 ? 'ok' : 'warn', 'Ciencia', ev.sci.w + ' / ' + ev.sci.target + ' pts'));
  rows.push(!(ev.A && ev.T && ev.N && ev.inst.length) ? checkRow('warn', 'Datos enviados a la Tierra', '—') : checkRow(ev.data.frac >= 1 ? 'ok' : ev.data.frac >= 0.5 ? 'warn' : 'bad', 'Datos enviados a la Tierra', pc(ev.data.frac)));
  const probs_ = p ? '<ul class="checks">' + [['Lanzamiento', p.launch], ['Crucero', 1 - p.hCruise], ['Inserción orbital', 1 - p.hIns], ['Operaciones', 1 - p.hOps], ['Reserva de presupuesto', 1 - p.hBudget]].map(r => checkRow(r[1] >= 0.93 ? 'ok' : r[1] >= 0.8 ? 'warn' : 'bad', r[0], pc(r[1]))).join('') + '</ul>' : '<p class="hint">Completa el diseño para ver las probabilidades.</p>';
  const warns = ev.warns.length ? '<ul class="warnlist">' + ev.warns.map(w => '<li>' + w + '</li>').join('') + '</ul>' : '';
  return '<h2>Revisión antes del lanzamiento</h2><p class="hint">Una misión real pasa por una revisión como esta. Si hay un ✕, no se puede lanzar. Durante el vuelo tendrás que tomar decisiones ante imprevistos, y lo que diseñaste te dará (o te quitará) opciones.</p>' +
    '<div class="box"><ul class="checks">' + rows.join('') + '</ul>' + warns + '</div>' +
    '<div class="cols"><div class="box"><h3>Dónde se va tu presupuesto</h3>' + brk(c.items, ' M') + '</div><div class="box"><h3>Dónde se va tu masa</h3>' + brk(ms.items, ' kg') + '</div></div>' +
    '<div class="box" style="margin-top:18px"><h3>Probabilidad de cada fase (sin eventos en vuelo)</h3>' + probs_ + '</div>' +
    (ev.complete ? shareBox(state.d, M.name + ' · mi diseño') : '') +
    '<div class="launch"><button type="button" class="btn primary big" data-act="launch" data-key="launch"' + (ev.canLaunch ? '' : ' disabled') + '>Lanzar misión</button>' +
    '<span class="hint" style="margin:0">' + (ev.canLaunch ? 'La simulación dura menos de un minuto y se detiene cuando haya que decidir.' : 'Corrige los ✕ para habilitar el lanzamiento.') + '</span></div>';
}

function designHTML() {
  const ev = evaluate(state.d);
  if (!ev && state.step !== 0) state.step = 0;
  const fns = [step0, step1, step2, step3, step4, step5];
  const adv = ev && state.step > 0 && state.step < 5 ? advice(ev) : null;
  const advHTML = adv ? '<div class="advice ' + adv[0] + '"><span>' + adv[1] + '</span></div>' : '';
  const body = fns[state.step](ev);
  const s = state.step, minStep = state.mode === 'compete' ? 1 : 0;
  const nav = '<div class="navrow"><div class="grp">' + (s > minStep ? '<button type="button" class="btn" data-act="goto" data-step="' + (s - 1) + '" data-key="back">Atrás</button>' : '') +
    (ev ? '<button type="button" class="btn ghost" data-act="starter" data-key="starter">Cargar diseño de ejemplo</button>' : '') + '</div>' +
    '<div class="grp">' + (s < 5 ? '<button type="button" class="btn primary" data-act="goto" data-step="' + (s + 1) + '" data-key="next"' + (ev ? '' : ' disabled') + '>' + (s === 4 ? 'Revisar diseño' : 'Siguiente') + '</button>' : '') + '</div></div>';
  return topbar() + '<div class="app has-panel"><div class="main">' + stepper(ev) + bannerHTML() + '<div class="diffbar"><button type="button" class="tog" data-act="infoall" data-key="infoall" aria-pressed="' + state.infoAll + '">' + (state.infoAll ? '✓' : '?') + ' Mostrar todas las explicaciones</button><span class="hint" style="margin:0">También puedes pulsar el signo ? de cada componente.</span></div>' + (ev && s > 0 ? craftHTML(state.d, ev) : '') + advHTML + body + nav + '</div><aside class="panel" aria-label="Panel de control">' + panelHTML(ev) + '</aside></div>';
}
function topbar() {
  const v = state.view, nav = v !== 'sim';
  return '<header class="top"><div class="brand"><i></i>Arquitecto de Misión</div><div class="grp" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' +
    (nav && v !== 'ranking' ? '<button type="button" class="btn ghost" data-act="ranking" data-key="t-rank">Ranking</button>' : '') +
    (nav && v !== 'library' && v !== 'compare' ? '<button type="button" class="btn ghost" data-act="library" data-key="t-lib">Mis diseños</button>' : '') +
    (v !== 'intro' ? '<button type="button" class="btn ghost" data-act="home" data-key="home">Inicio</button>' : '') +
    '<button type="button" class="btn ghost" data-act="lang" data-key="lang" lang="' + (LANG === 'es' ? 'en' : 'es') + '">' + (LANG === 'es' ? 'English' : 'Español') + '</button></div></header>';
}
function introHTML() {
  const u = [['$M', 'Presupuesto', 'Cada pieza cuesta. Si te pasas, no hay misión.'], ['kg', 'Masa', 'El cohete solo lleva cierta masa. El combustible también pesa.'], ['W', 'Energía', 'Los instrumentos y la radio consumen. Lejos del Sol los paneles rinden poco.'], ['Gb/día', 'Datos', 'Lo que no puedes enviar a la Tierra no cuenta.']];
  return topbar() + '<main class="intro wrap"><p class="eyebrow">Simulador de diseño de misiones espaciales</p><h1>Arquitecto<br>de Misión</h1>' +
    '<p class="lede">Diseña una misión completa, desde el cohete hasta la antena. Tienes cuatro recursos limitados y cada decisión afecta a los otros tres. Después lanza, resuelve los imprevistos del vuelo y mira si tu nave sobrevive.</p>' +
    '<ul class="units">' + u.map(x => '<li><b>' + x[0] + '</b><strong>' + x[1] + '</strong><p>' + x[2] + '</p></li>').join('') + '</ul>' +
    '<ol class="how"><li>Elige un destino y una dificultad.</li><li>Diseña la nave y mantén los cuatro medidores en verde.</li><li>Lanza y decide qué hacer cuando algo salga mal.</li></ol>' +
    '<button type="button" class="btn primary big" data-act="start" data-key="start">Empezar</button></main>';
}
function modeHTML() {
  return topbar() + '<main class="wrap" style="padding-block:20px 30px"><p class="eyebrow">Nueva partida</p><h2>¿Cómo quieres jugar?</h2><p class="hint">Cada partida empieza desde cero. Al terminar una misión o volver al inicio se borra el diseño.</p>' +
    '<div class="modes">' + MODES.map(m => opt({ act: 'mode', attrs: 'data-id="' + m.id + '"', key: 'mode-' + m.id, sel: false, cls: 'mode', tag: m.tag, title: m.title, desc: m.desc })).join('') + '</div></main>';
}
function setupHTML() {
  const S = state.setup, comp = state.mode === 'compete', word = comp ? 'Equipo' : 'Jugador';
  const names = [0, 1, 2, 3].slice(0, S.n).map(i => '<label>' + (comp ? 'Nombre del equipo ' : 'Nombre del jugador ') + (i + 1) + '<input class="field" type="text" maxlength="24" id="nm' + i + '" data-i="' + i + '" value="' + esc(S.names[i]) + '" placeholder="' + word + ' ' + (i + 1) + '"></label>').join('');
  const miss = comp ? MISSIONS.map(M => pick('smission', M.id, S.mission === M.id, { cls: 'mission', tag: '<span class="lvl">' + '●'.repeat(M.level) + '○'.repeat(4 - M.level) + ' ' + M.levelName + '</span>', title: M.name, desc: M.brief })).join('') : '';
  const diff = comp ? '<div class="diffbar" style="margin-top:14px"><span class="m-label">Dificultad</span><div class="seg" role="group" aria-label="Dificultad">' + Object.keys(DIFFS).map(k => '<button type="button" data-act="sdiff" data-v="' + k + '" data-key="sdf-' + k + '" aria-pressed="' + (S.diff === k) + '">' + DIFFS[k].name + '</button>').join('') + '</div></div>' : '';
  const roles = comp ? '' : '<div class="concept" style="margin-top:14px"><b>Roles</b>Director de misión (misión y lanzador) · Ingeniería de la nave (bus, energía, propulsión) · Ciencia (instrumentos) · Comunicaciones (antena y red). Con menos de 4 personas, algunas cubren más de un rol.</div>';
  return topbar() + '<main class="wrap" style="padding-block:20px 30px"><p class="eyebrow">' + (comp ? 'Competencia entre equipos' : 'Equipo cooperativo') + '</p><h2>' + (comp ? 'Configura la competencia' : 'Arma tu equipo') + '</h2>' +
    '<p class="hint">' + (comp ? 'Cada equipo diseña su misión por turnos en este dispositivo. Todos enfrentan el mismo objetivo y los mismos eventos de vuelo.' : 'Comparten un solo diseño y se turnan en este dispositivo. Las decisiones de vuelo las toma quien tiene el rol del área afectada.') + '</p>' +
    '<div class="diffbar"><span class="m-label">' + (comp ? 'Equipos' : 'Jugadores') + '</span><div class="seg" role="group" aria-label="Cantidad">' + [2, 3, 4].map(n => '<button type="button" data-act="count" data-v="' + n + '" data-key="n-' + n + '" aria-pressed="' + (S.n === n) + '">' + n + '</button>').join('') + '</div></div>' +

/* ---------- lienzo orbital ---------- */
function sizeCanvas() {
  const cv = $('#cv'); if (!cv) return;
  const w = cv.parentElement.clientWidth - 20 || 600, h = Math.round(w * 0.66), dpr = window.devicePixelRatio || 1;
  cv.style.height = h + 'px'; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);

}
function kepler(u, e) {

function draw(now) {
  const s = state.sim, cv = $('#cv'); if (!s || !cv) return;
  if (!cv._w) sizeCanvas();
  const ctx = cv.getContext('2d'), w = cv._w, h = cv._h, dpr = cv._dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim() || '#888';

    let bestV = null;
    if (r[2]) { const nums = vals.filter(v => typeof v === 'number' && isFinite(v)); if (nums.length > 1) bestV = r[2] === 'high' ? Math.max.apply(null, nums) : Math.min.apply(null, nums); }

/* ---------- informe ---------- */
function reportHTML() {
  const L = state.last, ev = L.ev, run = L.run, m = run.metrics, M = ev.M, pt = run.parts, comp = state.mode === 'compete';

  const part = (n, v, mx) => '<div class="part"><span>' + n + '</span><div class="bar"><i style="width:' + v / mx * 100 + '%"></i></div><span>' + v + ' / ' + mx + '</span></div>';

  const decs = run.decisions.length ? '<div class="decl-list">' + run.decisions.map(x => '<div class="decl g' + x.q + '"><div><b>' + esc(x.title) + '</b> · ' + esc(x.phase) + '<br>Elegiste: «' + esc(x.chosen) + '». ' + esc(x.result) + (x.q < 2 && x.best.indexOf(x.chosen) < 0 ? '<br><small>Mejor opción: «' + esc(x.best[0]) + '».</small>' : '') + '</div></div>').join('') + '</div>' : '<p class="hint">En este vuelo no ocurrieron eventos que requirieran decidir.</p>';

  else if (comp) rankBox = '<p class="hint">El puntaje de ' + esc(L.team) + ' se registró en la clasificación de la competencia y en el ranking.</p>';

  } else end = '<button type="button" class="btn primary" data-act="newgame" data-key="newgame">Nueva partida</button>';

    '<div class="facts">' + fact('Datos recibidos', gb) + fact('Presupuesto final', ev.sandbox ? 'Modo libre' : '$' + fmt(Math.max(0, ev.cost.budget - m.finalCost)) + ' M libres') + fact('Instrumentos activos', alive + ' / ' + L.d.inst.length) +
    fact('Margen de masa', ev.mass.margin != null ? pc(ev.mass.margin) : '—') + fact('Margen de energía', ev.power.margin != null ? pc(ev.power.margin) : '—') + fact('Buenas decisiones', good + ' / ' + run.decisions.length) + '</div>' +
    '<div class="cols"><div class="box"><h3>Por qué ' + (run.fatal ? 'falló' : 'funcionó') + '</h3><ul class="lessons">' + an.verdict.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' +
    '<div class="box"><h3>Cómo mejorar</h3><ul class="lessons">' + (an.improve.length ? an.improve.map(x => '<li>' + esc(x) + '</li>').join('') : '<li>Diseño equilibrado. Prueba una misión con más restricciones o una dificultad mayor.</li>') + '</ul></div></div>' +
    '<div class="box" style="margin-top:18px"><h3>Tus decisiones en vuelo</h3>' + decs + '</div>' +

}
function finalHTML() {
  const rows = state.teams.map((t, i) => ({ t, i })).sort((a, b) => b.t.res.total - a.t.res.total);
  const M = byId(MISSIONS, state.setup.mission);
  const cols = rows.map(r => ({ name: r.t.name, d: r.t.res.d, ev: r.t.res.ev, est: r.t.res.est }));
  const win = rows[0], tie = rows.length > 1 && rows[1].t.res.total === win.t.res.total;
  return topbar() + '<main class="wrap" style="padding-block:20px 30px"><p class="eyebrow">Competencia · ' + M.name + ' · ' + DIFFS[state.setup.diff].name + '</p><h2>' + (tie ? 'Empate en el primer lugar' : 'Gana el equipo ' + esc(win.t.name)) + '</h2>' +
    '<div class="scroll" style="margin-top:14px"><table class="tbl"><thead><tr><th>#</th><th>Equipo</th><th>Puntaje</th><th>Resultado</th><th>Costo</th><th>Éxito estimado</th><th>Buenas decisiones</th></tr></thead><tbody>' +
    rows.map((r, k) => { const x = r.t.res; return '<tr><td class="num">' + (k + 1) + '</td><td><b>' + esc(r.t.name) + '</b></td><td class="num"><b>' + x.total + '</b></td><td>' + esc(x.grade) + '</td><td class="num">$' + fmt(x.ev.cost.total) + ' M</td><td class="num">' + pc(x.ev.prob.total) + '</td><td class="num">' + x.good + ' / ' + x.nDec + '</td></tr>'; }).join('') + '</tbody></table></div>' +

/* ---------- control ---------- */
function render() {
  const app = $('#app'), act = document.activeElement, key = act && act.dataset ? act.dataset.key : null;
  const v = state.view;
  app.innerHTML = v === 'intro' ? introHTML() : v === 'mode' ? modeHTML() : v === 'setup' ? setupHTML() : v === 'design' ? designHTML() : v === 'sim' ? simHTML() :
    v === 'report' ? reportHTML() : v === 'final' ? finalHTML() : v === 'ranking' ? rankingHTML() : v === 'library' ? libraryHTML() : compareHTML();
  if (key) { const el = $('[data-key="' + key + '"]', app); if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) { /* sin foco */ } } }
}
function toggleIn(arr, id) { const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else arr.push(id); }
function show(view, step) { state.view = view; if (step != null) state.step = step; render(); try { window.scrollTo(0, 0); } catch (e) { /* sin scroll */ } }
const randSeed = () => Math.floor(Math.random() * 9000) + 1000;

function openReport() {
  const s = state.sim, d = JSON.parse(JSON.stringify(s.d)), ev = s.ev, run = s.run;
  const est = plannedScore(ev), good = run.decisions.filter(x => x.q === 2).length;
  const team = state.mode === 'compete' ? state.teams[state.cur].name : '';
  state.last = { d, ev, run, mode: state.mode, team, saved: false };
  if (state.mode === 'compete') {
    state.teams[state.cur].res = { total: run.total, grade: run.grade, d, ev, est, good, nDec: run.decisions.length };
    saveRank({ n: team, m: d.mission, df: d.diff, s: run.total, g: run.grade, t: 1, ts: Date.now() });
  }
  /* El diseño se borra al terminar la misión. */
  if (state.mode === 'compete') state.d = blank({ mission: state.setup.mission, diff: state.setup.diff });
  else state.d = blank({ sandbox: state.mode === 'sandbox' });
  state.sim = null; state.step = 0;
  show('report');
}

function onClick(e) {
  const el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el || el.disabled) return;
  const d = state.d, a = el.dataset.act, id = el.dataset.id;
  if (a === 'lang') { setLang(LANG === 'es' ? 'en' : 'es'); return; }
  if (a === 'start') show('mode');
  else if (a === 'home' || a === 'newgame') { resetAll(); show('intro'); }
  else if (a === 'mode') {
    if (id === 'workshop') { if (window.WS) window.WS.open(); }
    else if (id === 'single') { state.mode = 'single'; state.d = blank(); show('design', 0); }
    else if (id === 'sandbox') { state.mode = 'sandbox'; state.d = blank({ sandbox: true }); show('design', 0); }
    else { state.mode = id; state.setup = newSetup(); show('setup'); }
  }
  else if (a === 'mode-back') { state.mode = null; show('mode'); }
  else if (a === 'count') { state.setup.n = +el.dataset.v; render(); }
  else if (a === 'sdiff') { state.setup.diff = el.dataset.v; render(); }
  else if (a === 'setup-go') {
    const S = state.setup, names = [0, 1, 2, 3].slice(0, S.n).map(i => (S.names[i] || '').trim() || (state.mode === 'compete' ? 'Equipo ' : 'Jugador ') + (i + 1));
    if (state.mode === 'compete') {
      if (!S.mission) return;
      state.teams = names.map(n => ({ name: n, res: null })); state.cur = 0; state.seed = randSeed();
      state.d = blank({ mission: S.mission, diff: S.diff }); show('design', 1);
    } else { state.players = names; state.d = blank(); show('design', 0); }
  }
  else if (a === 'goto') { state.step = +el.dataset.step; show('design'); }
  else if (a === 'pick') {
    if (el.dataset.kind === 'smission') { state.setup.mission = id; render(); return; }
    d[el.dataset.kind] = id; render();
  }
  else if (a === 'info') { const k = el.dataset.k; if (state.infoAll) { state.infoAll = false; Object.keys(INFO).forEach(x => { state.info[x] = true; }); } state.info[k] = !state.info[k]; render(); }
  else if (a === 'infoall') { state.infoAll = !state.infoAll; if (!state.infoAll) state.info = {}; render(); }
  else if (a === 'diff') { d.diff = el.dataset.v; render(); }
  else if (a === 'calm') { d.calm = !d.calm; render(); }
  else if (a === 'inst') { toggleIn(d.inst, id); render(); }
  else if (a === 'toggle') { d[el.dataset.k] = !d[el.dataset.k]; render(); }
  else if (a === 'reserve') { d.reserve = +el.dataset.v; render(); }
  else if (a === 'starter') { Object.assign(d, JSON.parse(JSON.stringify(STARTERS[d.mission]))); render(); }
  else if (a === 'launch') startSim(state.mode === 'compete' ? state.seed : randSeed());
  else if (a === 'decide') chooseOption(id);
  else if (a === 'speed') { state.sim.speed = +el.dataset.v; document.querySelectorAll('[data-act="speed"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); }
  else if (a === 'skip') skipAhead();
  else if (a === 'report') openReport();
  else if (a === 'nextteam') {
    if (state.cur >= state.teams.length - 1) show('final');
    else { state.cur++; state.d = blank({ mission: state.setup.mission, diff: state.setup.diff }); show('design', 1); }
  }
  else if (a === 'saverank') {
    const input = $('#rank-name'), name = ((input && input.value) || '').trim() || 'Anónimo', L = state.last;
    store.set(NAME_KEY, name); state.nameDraft = name;
    saveRank({ n: name, m: L.d.mission, df: L.d.diff, s: L.run.total, g: L.run.grade, mode: L.mode, ts: Date.now() });
    L.saved = true; toast('Puntaje guardado en el ranking'); render();
  }
  else if (a === 'ranking') { state.from = state.view; state.rankM = (state.d && state.d.mission) || state.rankM; show('ranking'); }
  else if (a === 'library') { if (state.view !== 'compare') state.from = state.view; show('library'); }
  else if (a === 'back') show(state.from && state.from !== 'ranking' && state.from !== 'library' ? state.from : 'intro');
  else if (a === 'rankm') { state.rankM = id; render(); }
  else if (a === 'rankclear') { store.set(RANK_KEY, []); render(); }
  else if (a === 'savedesign') {
    const input = $('#save-name'), nm = ((input && input.value) || '').trim() || 'Mi diseño';
    saveDesign(nm, state.view === 'report' ? state.last.d : state.d); state.saveDraft = nm; toast('Diseño guardado en Mis diseños');
  }
  else if (a === 'copycode') { const c = $('#code-out'); copyText(c ? c.value : designToCode(state.d), 'code-out'); }
  else if (a === 'libsel') { /* se maneja en change */ }
  else if (a === 'libcompare') show('compare');
  else if (a === 'libload') {
    const it = store.get(LIB_KEY, []).find(x => x.id === id), dd = it && codeToDesign(it.code);
    if (!dd) { toast('Ese código no es válido'); return; }
    resetAll(); state.mode = dd.sandbox ? 'sandbox' : 'single'; state.d = dd; show('design', 5);
  }
  else if (a === 'libcopy') { const it = store.get(LIB_KEY, []).find(x => x.id === id); if (it) copyText(it.code, null); }
  else if (a === 'libdel') { store.set(LIB_KEY, store.get(LIB_KEY, []).filter(x => x.id !== id)); state.libSel = state.libSel.filter(x => x !== id); render(); }
  else if (a === 'libimport') {
    const input = $('#import-code'), dd = codeToDesign(input ? input.value : '');
    if (!dd) { toast('Código no válido. Revisa que esté completo.'); return; }
    saveDesign('Importado · ' + byId(MISSIONS, dd.mission).name, dd); toast('Diseño importado'); render();
  }
}
function onChange(e) {
  const el = e.target;
  if (el && el.dataset && el.dataset.act === 'libsel') {
    const id = el.dataset.id;
    if (el.checked) { if (state.libSel.length >= 3) { el.checked = false; toast('Puedes comparar hasta 3 diseños'); return; } if (!state.libSel.includes(id)) state.libSel.push(id); }
    else state.libSel = state.libSel.filter(x => x !== id);
    render();
  }
}
function onInput(e) {
  const el = e.target;
  if (!el) return;
  if (el.dataset && el.dataset.i != null && state.view === 'setup') state.setup.names[+el.dataset.i] = el.value;
  else if (el.id === 'save-name') state.saveDraft = el.value;
  else if (el.id === 'rank-name') state.nameDraft = el.value;
}
function onKey(e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset && e.target.dataset.act) { e.preventDefault(); onClick({ target: e.target }); }
}
